services:
  mysqldb:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: crypto_db
    networks:
      - crypto-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p123456"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend-service:
    build:
      context: ./be
    ports:
      - "5001:5001"
    depends_on:
      mysqldb:
        condition: service_healthy
    environment:
      DB_HOST: mysqldb
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: "123456"
      DB_NAME: crypto_db
    networks:
      - crypto-net

  web:
    build:
      context: ./fe
    ports:
      - "5002:5002"
    depends_on:
      - backend-service
    environment:
      BACKEND_URL: "http://backend-service:5001"
    networks:
      - crypto-net

networks:
  crypto-net:
    driver: bridge