apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: crypto
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: frontend
          image: arielsilberman/crypto-frontend:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5002
          env:
            - name: BACKEND_URL
              value: "http://backend-service:5001"
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: crypto
spec:
  type: ClusterIP
  selector:
    app: web
  ports:
    - name: http
      port: 5002
      targetPort: 5002